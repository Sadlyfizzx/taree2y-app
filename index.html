    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="طريقي | احجز رحلتك بسهولة داخل مصر" />

      name="twitter:description"
      content="ابحث عن الرحلات، اختر مقعدك، ادفع من المحفظة، وتابع رحلتك من تطبيق طريقي."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;

          document.documentElement.classList.toggle('dark', Boolean(prefersDark));
          document.documentElement.classList.toggle('light', !prefersDark);
          document.documentElement.style.colorScheme = prefersDark ? 'dark' : 'light';

          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute(
              'content',
              prefersDark ? '#020617' : '#f4f7fb',
            );
          }
        } catch {
          // ignore theme bootstrap failures
        }
      })();
    </script>
    <title>طريقي | احجز رحلتك بسهولة داخل مصر</title>
  </head>
